    <title>Só+1</title>

    <!--
      A prévia genérica do link, para quando ele é colado numa conversa (#229).

      Vale para todas as rotas. A da partida é montada no servidor pelo
      `api/partida.js`, porque o rastreador não roda JavaScript e o título
      precisa dizer QUAL partida — aqui não haveria como variar.

      A imagem é PNG de propósito: rastreador de mensageiro não renderiza SVG,
      e a `logo.svg` daria um cartão sem imagem. Ver `scripts/README-og-image.md`.

      A URL da imagem é absoluta porque rastreador não resolve caminho
      relativo de forma confiável — o WhatsApp em particular ignora. Se o
      domínio do app mudar, estas duas linhas mudam junto.
    -->
    <meta name="description" content="Organize sua partida, chame a galera e complete o time." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Só+1" />
    <meta property="og:title" content="Só+1 — Achou jogo." />
    <meta property="og:description" content="Organize sua partida, chame a galera e complete o time." />
    <meta property="og:image" content="https://app.so-mais-um.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
