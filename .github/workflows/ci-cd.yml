name: CI/CD - Só+1 Web

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # Lê os dois relatórios que o passo acima grava. O `test:ci` roda com
      # cobertura por isso: o README anuncia a porcentagem, e sem relatório
      # legível por máquina ela só seria conferida a olho — que é como foi de
      # ~28% para ~62% sem ninguém atualizar a frase.
      #
      # Rotas e páginas sob demanda não passam por aqui: são conferidas dentro
      # da própria suíte, em `src/routes/numeros-do-readme.test.tsx`.
      - name: Confere os números do README
        run: npm run readme:check

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          else
            npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          fi

      - name: Build project artifacts
        env:
          VITE_API_URL: https://api.so-mais-um.com
          VITE_GOOGLE_CLIENT_ID: 446784228326-i78g3nfnmdvpgoqt6bmdgr43hc756p13.apps.googleusercontent.com
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel build --prod --token=$VERCEL_TOKEN
          else
            npx vercel build --token=$VERCEL_TOKEN
          fi

      - name: Deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
          fi
