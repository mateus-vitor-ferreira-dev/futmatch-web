<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="21.5"/></clipPath>
  </defs>
  <!-- Fundo verde -->
  <circle cx="32" cy="32" r="31" fill="#16a34a"/>
  <!-- Bola branca -->
  <circle cx="32" cy="32" r="22" fill="#f1f5f9"/>
  <!-- Padrão de pentágonos (coordenadas matematicamente corretas) -->
  <g clip-path="url(#ball)" fill="#1e293b">
    <!-- Pentágono central (vértice apontando para cima) -->
    <polygon points="32,25 25.3,29.8 27.9,37.7 36.1,37.7 38.7,29.8"/>
    <!-- Superior (θ=90°) -->
    <polygon points="32,22.5 37.7,18.4 35.5,11.6 28.5,11.6 26.3,18.4"/>
    <!-- Superior-esquerdo (θ=162°) -->
    <polygon points="23,29.1 20.8,22.4 13.7,22.4 11.6,29.1 17.3,33.2"/>
    <!-- Inferior-esquerdo (θ=234°) -->
    <polygon points="26.4,39.7 19.4,39.7 17.2,46.4 22.9,50.5 28.6,46.4"/>
    <!-- Inferior-direito (θ=306°) -->
    <polygon points="37.6,39.7 35.4,46.4 41.1,50.5 46.8,46.4 44.6,39.7"/>
    <!-- Superior-direito (θ=18°) -->
    <polygon points="41,29.1 46.7,33.2 52.4,29.1 50.3,22.4 43.2,22.4"/>
  </g>
  <!-- Borda da bola -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#94a3b8" stroke-width="0.5"/>
</svg>